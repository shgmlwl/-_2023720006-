<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 산돌 격동고딕 -->
    <link
      rel="preconnect"
      href="https://qns2c88qif.execute-api.ap-northeast-2.amazonaws.com"
    />
    <link
      rel="stylesheet"
      href="https://qns2c88qif.execute-api.ap-northeast-2.amazonaws.com/v1/api/css/drop_fontstream_css/?sid=gAAAAABpOSOELa13yqSiXud3sZnVBP2uHJhHzLwWgt-HwVZ951lyhNu-sh5_uKRJfepaNlHHfpsvmnezGZj1gaMIZTLjJ2d4e1RBmg_ESMLWkStNa1SfFv11Wo6KDrulZBpHsd2yV6MHs14uVMuDKOogOHTNT7p2E8frhie9hfyjC096fwFFdoBUxW07uo1rQ6LK3wyh0T1O9By1qP9aUjJbjnftbZXiSZy2VWTx3J11cD-JYNkAsiRffOqwTQb9pOqOQMzcJWDp"
      charset="utf-8"
      referrerpolicy="origin"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/index.css" />

    <!-- GSAP -->
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>

    <title>main_p</title>
  </head>

  <body>
    <div id="page-wrap">
      <div id="layout">
        <button id="back-btn" type="button" aria-label="메인으로 돌아가기">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>

        <!-- LEFT : 시소 영역 -->
        <div id="left_p">
          <div id="seesaw-wrap">
            <div id="under">
              <!-- balance / unbalance -->
              <div id="text">
                <span class="un-part">un</span>
                <span class="bal-part">balance</span>
              </div>

              <div id="si">
                <!-- 카드 -->
                <div id="re">
                  <img
                    id="project-logo"
                    src="Img/yg_logo.png"
                    alt="YG Entertainment 로고"
                  />
                </div>

                <!-- ✅ 삼각 받침 (SVG로 교체) -->
                <svg id="tri" viewBox="0 0 210 130" aria-hidden="true">
                  <polygon points="105,0 210,130 0,130"></polygon>
                </svg>

                <!-- 막대 + 키워드 컨테이너 -->
                <div id="re_l">
                  <div id="keyword-container"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT : 정보 영역 -->
        <div id="right_p">
          <div id="right_detail">
            <div id="desinger">
              <h1>심석용</h1>
              <p>
                건축 전공에서 출발한 심석용 디자이너는
                <span class="company-key" data-company="tbwa"
                  >TBWA 인턴 경험</span
                >을 계기로 그래픽·브랜딩 디자이너로 전향했다. 이후
                <span class="company-key" data-company="yg"
                  >YG 엔터테인먼트</span
                >에서 아이콘, 블랙핑크, 빅뱅 등의 아티스트 브랜딩을 경험했고,
                공간 브랜딩 에이전시
                <span class="company-key" data-company="first"
                  >더퍼스트펭귄</span
                >을 거쳐
                <span class="company-key" data-company="hyundai">현대카드</span
                >와
                <span class="company-key" data-company="toss">토스</span>에서
                인하우스 디자이너로 활동했다. 그는 토스에서 유스 카드와
                <span class="company-ref">〈비주류 경제학〉</span>
                프로젝트를 통해 ‘로고 하나에서 시작해 판을 키우는 기획’의
                중요성을 강조하며, 포트폴리오는 작업 나열이 아닌 서사라고
                말한다.
              </p>
            </div>

            <!-- 회사별 섹션 -->
            <section id="yg_section" data-company="yg">
              <h2>YG 엔터테인먼트</h2>
              <div class="section_detail"></div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="js/index.js"></script>
  </body>
</html>
